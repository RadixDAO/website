name: Verify and deploy

on:
  pull_request:
    paths-ignore:
      - "src/content/notices/**"
  merge_group:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm content:lint
      - run: pnpm notice-form:check
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
      - run: pnpm test

  deploy-production:
    name: Deploy production Worker
    needs: verify
    if: >-
      github.repository == 'RadixDAO/website' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      statuses: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find notices added by this push
        id: notices
        run: node scripts/list-changed-notices.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - name: Report publishing progress on the merged pull request
        id: deployment-report
        if: steps.notices.outputs.slugs != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- publishing-deployment -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            })
            const pull = pulls.data.find((candidate) =>
              candidate.merged_at && candidate.base.ref === context.payload.repository.default_branch
            )

            if (!pull) {
              core.warning(`No merged pull request is associated with ${context.sha}.`)
              return
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            const body = `${marker}\n⏳ Production publishing is in progress.\n\n[Follow the workflow](${runUrl})`
            const comment = existing
              ? await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
              : await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pull.number,
                  body,
                })

            core.setOutput('comment_id', String(comment.data.id))
      - name: Mark live verification as pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'publishing/live',
              description: 'Deploying and checking the public origin',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - run: pnpm build
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
      - name: Deploy canonical production Worker
        run: pnpm exec wrangler deploy
      - name: Verify public origin and new notice permalinks
        run: >-
          node scripts/check-live-deployment.mjs
          https://radixdao.org
          "${{ github.sha }}"
          "${{ steps.notices.outputs.slugs }}"
      - name: Report live result on the commit
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
          NOTICE_SLUGS: ${{ steps.notices.outputs.slugs }}
        with:
          script: |
            const success = process.env.DEPLOY_JOB_STATUS === 'success'
            const slugs = (process.env.NOTICE_SLUGS || '').split(',').filter(Boolean)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const targetUrl = success && slugs.length === 1
              ? `https://radixdao.org/notices/${slugs[0]}/`
              : runUrl

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'publishing/live',
              description: success
                ? 'Public origin verified'
                : 'Deploy or public-origin verification failed',
              target_url: targetUrl,
            })

            if (success && slugs.length > 0) {
              const links = slugs
                .map((slug) => `- https://radixdao.org/notices/${slug}/`)
                .join('\n')
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `Published and verified on the Official Venue:\n\n${links}`,
              })
            }

      - name: Update the merged pull request with the publishing result
        if: always() && steps.deployment-report.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
          NOTICE_SLUGS: ${{ steps.notices.outputs.slugs }}
          PR_COMMENT_ID: ${{ steps.deployment-report.outputs.comment_id }}
        with:
          script: |
            const success = process.env.DEPLOY_JOB_STATUS === 'success'
            const slugs = (process.env.NOTICE_SLUGS || '').split(',').filter(Boolean)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const marker = '<!-- publishing-deployment -->'
            const links = slugs
              .map((slug) => `- https://radixdao.org/notices/${slug}/`)
              .join('\n')
            const body = success
              ? `${marker}\n✅ Published and verified on the Official Venue:\n\n${links}\n\n[View workflow](${runUrl})`
              : `${marker}\n❌ Production publishing or public verification failed.\n\n[View workflow](${runUrl})`

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.PR_COMMENT_ID),
              body,
            })

  deploy-preview:
    name: Deploy PR preview Worker
    needs: verify
    if: >-
      github.repository == 'RadixDAO/website' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
      - name: Create preview deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview/pr-${context.payload.pull_request.number}`,
              description: `Deploying Cloudflare Worker preview for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            })
            core.setOutput("id", deployment.data.id)
      - name: Upload preview version
        id: upload
        run: |
          output=$(pnpm exec wrangler versions upload --preview-alias "$CLOUDFLARE_PREVIEW_ALIAS" 2>&1) || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          preview_url=$(printf '%s\n' "$output" | grep -oE "https://${CLOUDFLARE_PREVIEW_ALIAS}-[^[:space:]]*\.workers\.dev" | head -n1)
          : "${preview_url:?Wrangler did not return the named preview URL}"
          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Publish preview URL
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: process.env.PREVIEW_URL,
              description: "Cloudflare Worker preview is ready",
              auto_inactive: true,
            })
      - name: Mark preview deployment as failed
        if: failure() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
              description: "Cloudflare Worker preview deployment failed",
            })
