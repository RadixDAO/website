name: Create notice pull request

on:
  issues:
    types: [opened]

jobs:
  authorize:
    name: Confirm publisher has write access
    if: >-
      startsWith(github.event.issue.title, '[Publish notice]') &&
      contains(github.event.issue.body, '### Notice type')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check the submitter's effective repository permission
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            let permission = 'none'
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.issue.user.login,
              })
              permission = response.data.permission
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const allowed = ['write', 'maintain', 'admin'].includes(permission)
            core.setOutput('allowed', String(allowed))

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Notice automation requires write, maintain, or admin access to this repository. No branch or pull request was created.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              })
            }

  create:
    name: Generate validated notice pull request
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the notice from the issue form
        id: notice
        run: node scripts/create-notice-from-issue.mjs "$GITHUB_EVENT_PATH"
      - name: Validate generated content
        run: pnpm content:lint
      - name: Commit the generated notice on a repository branch
        env:
          BRANCH: ${{ steps.notice.outputs.branch }}
          NOTICE_PATH: ${{ steps.notice.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$NOTICE_PATH"
          git commit -m "content(notices): draft notice from issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"
      - name: Open the pull request and close the form issue
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.notice.outputs.branch }}
          NOTICE_PATH: ${{ steps.notice.outputs.path }}
          NOTICE_TITLE: ${{ steps.notice.outputs.title }}
        with:
          script: |
            const pull = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.BRANCH,
              base: context.payload.repository.default_branch,
              title: `Publish notice: ${process.env.NOTICE_TITLE}`,
              body: `Generated from #${context.issue.number}.\n\nFile: \`${process.env.NOTICE_PATH}\`\n\nA write-access user must review the content and approve the pull request workflow before merging.`,
            })

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Created #${pull.data.number}. Review and merge that pull request to publish.`,
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            })
