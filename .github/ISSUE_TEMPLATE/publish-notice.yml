# Generated by scripts/generate-notice-form.mjs from src/data/notice-types.ts.
# Run pnpm notice-form:generate after changing notice types.
name: Publish a notice
description: Create a validated notice pull request (write access required)
title: "[Publish notice] "
body:
  - type: markdown
    attributes:
      value: |
        This form opens a pull request; it does not publish immediately. For a time-critical compliance challenge, use the documented manual path.
  - type: dropdown
    id: notice_type
    attributes:
      label: Notice type
      options:
        - "Activation statement (activation-statement)"
        - "Council resolution (council-resolution)"
        - "Advisory acknowledgement (advisory-acknowledgement)"
        - "Vacancy notice (vacancy-notice)"
        - "Reduced-quorum activation notice (reduced-quorum-notice)"
        - "Identifier register change (identifier-register-change)"
        - "Compliance challenge (compliance-challenge)"
        - "Regulatory or legal demand notice (regulatory-demand-notice)"
        - "Status report (status-report)"
        - "Prior-disclosure notice (prior-disclosure-notice)"
        - "Delegate statement (delegate-statement)"
        - "Working Group / repository registry update (registry-update)"
    validations:
      required: true
  - type: input
    id: notice_title
    attributes:
      label: Notice title
      placeholder: Exact title of the notice
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Body
      description: Markdown content for the notice. It is copied without trimming or reflowing.
    validations:
      required: true
  - type: input
    id: notice_date
    attributes:
      label: Notice date
      description: Optional UTC timestamp for a statutory notice period (YYYY-MM-DDTHH:MM:SSZ).
      placeholder: 2026-08-11T14:30:00Z
  - type: dropdown
    id: verbatim
    attributes:
      label: Verbatim publication
      description: Select Yes only when the body must be rendered exactly as submitted.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: supersedes
    attributes:
      label: Supersedes
      description: Optional filename of the notice being corrected, without .md.
      placeholder: 2026-08-01-example-resolution
