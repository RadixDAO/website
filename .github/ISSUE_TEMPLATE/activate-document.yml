# Generated by scripts/generate-document-forms.mjs from src/data/govern.json.
# Run pnpm document-forms:generate after changing the document index.
name: Activate a governance document
description: Move a pending document into force after an activation vote (write access required)
title: "[Activate document] "
body:
  - type: markdown
    attributes:
      value: |
        Use this when an activation vote has passed for a document currently shown as pending. **Do not enter a digest.** The workflow downloads the published PDF, hashes it, and cross-checks the result against registry.json in the governance repository.
  - type: dropdown
    id: document
    attributes:
      label: Document
      options:
        - "Charter (charter)"
        - "DAO Parameters Registry (dao-parameters-registry)"
        - "Proposal & Voting Framework (proposal-and-voting-framework)"
        - "Execution & Treasury Actions Policy (execution-and-treasury-actions-policy)"
        - "Treasury Signers Operational Rules (treasury-signers-rules)"
        - "On-Chain Identifiers & Verification Policy (on-chain-identifiers-and-verification-policy)"
        - "RAC Mandate (rac-mandate)"
        - "Delegate Mandate (delegate-mandate)"
        - "Elections & Role Governance Policy (elections-and-role-governance-policy)"
        - "Working Group Framework (working-group-framework)"
        - "Roles Registry (roles-registry)"
        - "Code of Conduct (code-of-conduct)"
        - "Conflict of Interest Policy (conflict-of-interest-policy)"
        - "Dispute Resolution & Arbitration Policy (dispute-resolution-and-arbitration-policy)"
        - "Emergency & Safeguards Policy (emergency-and-safeguards-policy)"
        - "Governance Continuity Framework (governance-continuity-framework)"
        - "Contributor Compensation Policy (contributor-compensation-policy)"
        - "Contributor Onboarding and Offboarding (contributor-onboarding-and-offboarding)"
        - "Source Code Stewardship Policy (source-code-stewardship-policy)"
        - "Open Source & IP Policy (open-source-and-ip-policy)"
        - "Governance Maintenance & Upgrade Framework (governance-maintenance-and-upgrade-framework)"
        - "Compliance Operations Policy (compliance-operations-policy)"
        - "Charter Reading Guide (charter-reading-guide)"
        - "Policy Library Reading Guide (policy-library-reading-guide)"
        - "Election Methods Guide (election-methods-guide)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Semantic version of the activated document, as recorded in registry.json.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Source commit
      description: Full 40-character commit SHA in the governance repository holding this version.
      placeholder: 00eb84ca97b7fe78b23cb59fa72b3a4f409dc416
    validations:
      required: true
  - type: input
    id: effective
    attributes:
      label: Effective date
      description: The date this version takes effect (YYYY-MM-DD).
      placeholder: "2026-09-21"
    validations:
      required: true
  - type: input
    id: transaction
    attributes:
      label: Activating transaction
      description: Optional. The Radix transaction that recorded this document's digest on-chain.
      placeholder: txid_rdx1...
